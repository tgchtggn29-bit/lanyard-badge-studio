<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanyard Badge Studio · 工牌工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- fonts load without blocking; if Google Fonts is unreachable (e.g. mainland China) system fonts are used -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0A0A0A;--panel:#121212;--line:rgba(255,255,255,.10);--text:#F2F2F2;--mute:#8A8579;--acc:#D8FF3E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 "Inter","Noto Sans SC",sans-serif}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.02em}
header .sp{flex:1}
button,.btn{background:#1b1b1b;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);color:#0A0A0A;border-color:var(--acc)}
button.primary:hover{color:#0A0A0A;filter:brightness(1.05)}
main{display:grid;grid-template-columns:340px 1fr;height:calc(100% - 56px)}
aside{border-right:1px solid var(--line);overflow:auto;padding:14px 16px 40px;background:var(--panel)}
aside h3{font-size:11px;letter-spacing:.16em;color:var(--acc);margin:18px 0 8px;font-weight:800}
aside label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
aside input[type=text],aside textarea,aside select{width:100%;background:#0c0c0c;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font:13px inherit;font-family:inherit}
aside textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colors div{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute)}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.warn{background:rgba(255,120,90,.12);border:1px solid rgba(255,120,90,.4);color:#ffb3a0;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px;display:none}
section.view{position:relative;overflow:hidden;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button.on{background:var(--acc);color:#0A0A0A;border-color:var(--acc)}
.pane{flex:1;display:none;overflow:auto;position:relative}
.pane.on{display:block}
/* ---- 3D badge stage ---- */
#stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background:radial-gradient(ellipse at 50% 35%,rgba(216,255,62,.12),transparent 60%),var(--bg)}
#stage.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#rope{position:absolute;left:0;top:0;pointer-events:none}
.hang{position:absolute;width:300px;height:395px;perspective:1400px;transform-style:preserve-3d}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50%}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face canvas{width:100%;height:100%;display:block;pointer-events:none}
.face.back{transform:rotateY(180deg)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:rgba(18,18,18,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-size:12px;color:var(--mute);z-index:5}
.hint input[type=range]{width:110px;accent-color:var(--acc)}
/* ---- other panes ---- */
.gallery{padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card .t{font-weight:800;font-size:13px}.card .s{font-size:12px;color:var(--mute)}
.card canvas,.card img{display:block;border-radius:8px;background:#000;max-width:100%}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:50;overflow:auto;cursor:zoom-out}
#lightbox img{display:block;margin:30px auto;max-width:none;width:min(1100px,96vw)}
/* ---- chat assistant ---- */
#chat{position:absolute;right:16px;bottom:16px;width:340px;max-height:calc(100% - 90px);display:flex;flex-direction:column;z-index:20;
  background:rgba(16,16,16,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#chat .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#chat .ch b{font-size:13px}#chat .ch span{font-size:11px;color:var(--mute)}#chat .ch i{margin-left:auto;font-style:normal;color:var(--mute)}
#chat .msgs{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
#chat .m{max-width:92%;padding:8px 10px;border-radius:12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#chat .m.bot{background:#1d1d1d;border:1px solid var(--line);align-self:flex-start}
#chat .m.me{background:var(--acc);color:#0A0A0A;align-self:flex-end;font-weight:600}
#chat .m img{max-width:100%;max-height:110px;object-fit:contain;border-radius:8px;display:block;margin-top:6px}
#chat .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin:0 3px;border:1px solid rgba(255,255,255,.3)}
#chat .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
#chat .chips button{padding:4px 10px;font-size:11.5px}
#chat form{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
#chat form input[type=text]{flex:1;background:#0c0c0c;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px;font:13px inherit;font-family:inherit;min-width:0}
#chat form label{cursor:pointer;font-size:18px;line-height:1;padding:4px}
#chat.min .msgs,#chat.min .chips,#chat.min form{display:none}
/* ---- name cards ---- */
.ncrow{display:flex;gap:14px;flex-wrap:wrap}.ncrow canvas{width:300px;height:auto}
.card.pick{cursor:pointer}.card.pick.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
@media (max-width:860px){main{grid-template-columns:1fr;height:auto}aside{max-height:none;border-right:0;border-bottom:1px solid var(--line)}section.view{height:80vh}}
</style>
</head>
<body>
<header>
  <span class="dot"></span><h1>Lanyard Badge Studio · 工牌工作室</h1>
  <span class="sp"></span>
  <label class="btn">导入配置<input id="importCfg" type="file" accept=".json" hidden></label>
  <button id="exportCfg" class="primary">导出 brand.json</button>
</header>
<main>
<aside>
  <h3>品牌</h3>
  <label>品牌名称</label><input id="f_name" type="text">
  <label>背景大字（建议 2–6 个字母）</label><input id="f_giant" type="text">
  <div class="row">
    <div><label>Logo（可选，PNG/SVG）</label><input id="f_logo" type="file" accept="image/*"></div>
  </div>
  <h3>品牌色</h3>
  <div class="colors">
    <div>主色<input id="c_accent" type="color"></div>
    <div>辅助色<input id="c_accent2" type="color"></div>
    <div>底色<input id="c_bg" type="color"></div>
  </div>
  <h3>工牌正面</h3>
  <div class="row"><div><label>卡片品牌</label><input id="f_cbrand" type="text"></div><div><label>右上角</label><input id="f_corner" type="text"></div></div>
  <label>小标题</label><input id="f_kicker" type="text">
  <label>大标题（每行一句，最后一行后面接高亮词）</label><textarea id="f_headline" rows="2"></textarea>
  <label>高亮词</label><input id="f_highlight" type="text">
  <label>中间图案</label>
  <select id="f_hero"><option value="calendar">日历格子</option><option value="image">上传图片（吉祥物/产品）</option><option value="none">留空</option></select>
  <div id="heroOpts">
    <div class="row"><div><label>高亮日期</label><input id="f_hot" type="text" placeholder="3,9,12,17,24"></div><div><label>今天</label><input id="f_today" type="text"></div></div>
  </div>
  <div id="heroImg" style="display:none"><label>中间图片</label><input id="f_heroimg" type="file" accept="image/*"></div>
  <div class="row"><div><label>底条标题</label><input id="f_band" type="text"></div></div>
  <label>底条副标题</label><input id="f_bandsub" type="text">
  <h3>工牌背面</h3>
  <div class="row"><div><label>姓名</label><input id="b_name" type="text"></div><div><label>编号</label><input id="b_id" type="text"></div></div>
  <label>职位</label><input id="b_title" type="text">
  <label>备注</label><input id="b_note" type="text">
  <h3>名片</h3>
  <label>名片样式</label><select id="n_style"><option value="grid">暗夜网格</option><option value="neon">品牌色底</option><option value="minimal">极简白</option></select>
  <label>名片口号</label><input id="n_slogan" type="text" placeholder="留空则用海报副标题">
  <div class="row"><div><label>电话</label><input id="n_phone" type="text"></div><div><label>微信</label><input id="n_wechat" type="text"></div></div>
  <label>邮箱</label><input id="n_email" type="text">
  <label>地址</label><input id="n_address" type="text">
  <h3>挂绳 & 动画</h3>
  <label>挂绳文字（用 | 分隔）</label><input id="f_strap" type="text">
  <label>浮动标签（每行一个，最多 12 个）</label><textarea id="f_tags" rows="6"></textarea>
  <label>放大缩小的品牌字</label><input id="f_pulse" type="text">
  <label>左上角标题 / 副标题</label><div class="row"><input id="h_title" type="text"><input id="h_sub" type="text"></div>
  <label>右上角两行</label><textarea id="h_right" rows="2"></textarea>
  <label>底部署名</label><input id="f_credit" type="text">
  <h3>海报 / 横幅</h3>
  <label>标题（每行一句）</label><textarea id="p_title" rows="2"></textarea>
  <label>副标题（两行）</label><textarea id="p_sub" rows="2"></textarea>
  <div class="row"><div><label>账号</label><input id="p_handle" type="text"></div><div><label>渠道</label><input id="p_channels" type="text"></div></div>
  <div id="urlWarn" class="warn"></div>
</aside>

<section class="view">
  <div class="tabs">
    <button data-pane="p3d" class="on">3D 工牌（可拖拽）</button>
    <button data-pane="panim">动画预览</button>
    <button data-pane="pposter">海报 & 横幅</button>
    <button data-pane="pcard">名片</button>
    <button data-pane="pprint">印刷稿</button>
  </div>

  <div id="p3d" class="pane on">
    <div id="stage">
      <div id="world">
        <canvas id="rope"></canvas>
        <div class="hang" id="hang"><div class="flip" id="flip">
          <div class="face front" id="faceFront"></div>
          <div class="face back" id="faceBack"></div>
        </div></div>
      </div>
      <div class="hint">
        <span>拖动晃动 · 右键/Shift 拖动旋转 · 双击翻面 · 滚轮缩放</span>
        <input id="zoom" type="range" min="0.6" max="2.6" step="0.01" value="1" title="缩放">
        <button id="btnFlip">翻面</button>
        <button id="btnDrop">重新掉落</button>
        <button id="btnDetail" class="primary">看细节</button>
      </div>
    </div>
  </div>

  <div id="panim" class="pane">
    <div class="gallery">
      <div class="card"><div class="t">动画预览（实时，不含动态模糊）</div>
        <canvas id="anim" width="540" height="960" style="width:360px;height:640px"></canvas>
        <div class="row"><button id="btnRec">录制一遍 WebM</button></div>
        <div class="s">MP4 / GIF / 4K / 首帧即封面 等成片请用命令行：<br><code>npm run render -- --config brand.json</code></div>
      </div>
    </div>
  </div>

  <div id="pposter" class="pane"><div class="gallery" id="posterGallery"></div></div>
  <div id="pcard" class="pane"><div class="gallery" id="cardGallery"></div></div>
  <div id="pprint" class="pane"><div class="gallery" id="printGallery"></div></div>

  <div id="chat">
    <div class="ch" id="chatHead"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)"></span>
      <div><b>对话助手 · 做你自己的工牌</b><br><span>上传品牌资料，或直接告诉我要改什么</span></div><i id="chatToggle">—</i></div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form id="chatForm" autocomplete="off">
      <label title="上传 Logo / 品牌图 / brand.json">📎<input id="chatFile" type="file" accept="image/*,.json" hidden></label>
      <input id="chatInput" type="text" placeholder="例如：品牌叫 Nova，主色 #FF5A3C">
      <button class="primary" type="submit">发送</button>
    </form>
  </div>
</section>
</main>
<div id="lightbox"><img id="lbImg" alt=""></div>

<script src="../src/engine.js"></script>
<script>
const E = BadgeEngine;
let cfg = JSON.parse(JSON.stringify(E.DEFAULT_CONFIG));
cfg.fonts = { cjk: 'Noto Sans SC', latin: 'Inter' };
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- form <-> config
const bind = [
  ['f_name', 'name'], ['f_giant', 'giantWord'], ['f_cbrand', 'card.brand'], ['f_corner', 'card.corner'], ['f_kicker', 'card.kicker'],
  ['f_highlight', 'card.highlight'], ['f_band', 'card.bandTitle'], ['f_bandsub', 'card.bandSub'],
  ['b_name', 'back.name'], ['b_id', 'back.id'], ['b_title', 'back.title'], ['b_note', 'back.note'],
  ['f_pulse', 'pulse'], ['h_title', 'header.title'], ['h_sub', 'header.sub'], ['f_credit', 'credit'],
  ['p_handle', 'poster.handle'], ['p_channels', 'poster.channels'],
  ['c_accent', 'theme.accent'], ['c_accent2', 'theme.accent2'], ['c_bg', 'theme.bg'],
  ['f_hero', 'card.hero.type'], ['f_today', 'card.hero.today', 'num'],
  ['n_style', 'namecard.style'], ['n_slogan', 'namecard.slogan'], ['n_phone', 'contact.phone'], ['n_wechat', 'contact.wechat'], ['n_email', 'contact.email'], ['n_address', 'contact.address']
];
const lists = [['f_headline', 'card.headline', '\n'], ['f_tags', 'tags', '\n'], ['h_right', 'header.right', '\n'],
  ['p_title', 'poster.title', '\n'], ['p_sub', 'poster.sub', '\n'], ['f_strap', 'strap', '|'], ['f_hot', 'card.hero.highlights', ',', 'num']];
const get = (o, p) => p.split('.').reduce((a, k) => a && a[k], o);
const set = (o, p, v) => { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => { a[k] = a[k] || {}; a = a[k]; }); a[ks.at(-1)] = v; };
function fillForm() {
  bind.forEach(([id, p]) => { const v = get(cfg, p); $(id).value = v == null ? '' : v; });
  lists.forEach(([id, p, sep]) => { $(id).value = (get(cfg, p) || []).join(sep === '\n' ? '\n' : sep === '|' ? ' | ' : ','); });
  toggleHero();
}
function readForm() {
  bind.forEach(([id, p, t]) => { let v = $(id).value; if (t === 'num') v = v === '' ? null : +v; set(cfg, p, v); });
  lists.forEach(([id, p, sep, t]) => {
    let arr = $(id).value.split(sep).map(s => sep === '\n' ? s.replace(/\s+$/, '') : s.trim()).filter(s => s.length);
    if (p === 'card.headline') arr = $(id).value.split('\n').filter((s, i, a) => s.length || i < a.length - 1);
    if (t === 'num') arr = arr.map(Number).filter(n => !isNaN(n));
    set(cfg, p, arr);
  });
  cfg.theme.giant = null;
}
function toggleHero() { const t = $('f_hero').value; $('heroOpts').style.display = t === 'calendar' ? '' : 'none'; $('heroImg').style.display = t === 'image' ? '' : 'none'; }
const fileToURL = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
$('f_logo').onchange = async e => { cfg.logo = e.target.files[0] ? await fileToURL(e.target.files[0]) : null; apply(); };
$('f_heroimg').onchange = async e => { set(cfg, 'card.hero.image', e.target.files[0] ? await fileToURL(e.target.files[0]) : null); apply(); };
$('f_hero').onchange = () => { toggleHero(); readForm(); apply(); };
let tmr; document.querySelector('aside').addEventListener('input', e => { if (e.target.type === 'file') return; clearTimeout(tmr); tmr = setTimeout(() => { readForm(); apply(); }, 250); });

$('exportCfg').onclick = () => download(new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' }), 'brand.json');
$('importCfg').onchange = async e => { const f = e.target.files[0]; if (!f) return; cfg = E.DEFAULT_CONFIG && Object.assign(JSON.parse(JSON.stringify(E.DEFAULT_CONFIG)), JSON.parse(await f.text())); fillForm(); apply(); };
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const dlCanvas = (cv, name) => cv.toBlob(b => download(b, name), 'image/png');

// ---------------------------------------------------------------- apply config everywhere
let faces = {};
async function apply() {
  await E.setConfig(cfg);
  document.documentElement.style.setProperty('--acc', E.config.theme.accent);
  const hits = E.findUrls(cfg);
  $('urlWarn').style.display = hits.length ? 'block' : 'none';
  $('urlWarn').textContent = hits.length ? '⚠ 检测到网址：' + hits.map(h => h.match.join(' ')).join('、') + '。小红书等平台可能判定违规，建议改成品牌名或账号。' : '';
  faces.front = E.holderCanvas('front', 2.5); faces.back = E.holderCanvas('back', 2.5);
  $('faceFront').replaceChildren(faces.front); $('faceBack').replaceChildren(faces.back);
  renderPoster(); renderPrint(); renderNameCards();
}

// ---------------------------------------------------------------- 3D badge: verlet lanyard + CSS 3D card
const stage = $('stage'), world = $('world'), rope = $('rope'), rc = rope.getContext('2d'), hang = $('hang'), flip = $('flip');
const N = 16, ROPE = 330, SEG = ROPE / N, CARD_W = 300, CARD_H = 395, CORD = 18, ORIGIN_Y = 24 / 500 * CARD_H;
let SW = 800, SH = 800, zoom = 1, pts = [], ang = 0, av = 0, yaw = 0, yv = 0, yawTarget = 0, tilt = 0;
let drag = null;
function layout() {
  const r = stage.getBoundingClientRect(); SW = r.width; SH = r.height;
  const dpr = Math.min(3, (window.devicePixelRatio || 1) * Math.max(1, zoom));
  rope.width = SW * dpr; rope.height = SH * dpr; rope.style.width = SW + 'px'; rope.style.height = SH + 'px'; rc.setTransform(dpr, 0, 0, dpr, 0, 0);
  world.style.width = SW + 'px'; world.style.height = SH + 'px';
  const cx = (SW - chatSpace()) / 2;
  world.style.transform = `translate(${cx}px,0) scale(${zoom}) translate(${-cx}px,0)`;
  document.querySelector('.hint').style.left = cx + 'px';
}
function chatSpace() { const c = $('chat'); return c && !c.classList.contains('min') && SW > 980 ? 372 : 0; }
function anchor() { return { x: (SW - chatSpace()) / 2, y: -40 }; }
function drop() {
  const a = anchor(); pts = [];
  for (let i = 0; i <= N; i++) { const y = a.y + i * SEG - 520 * (i / N); pts.push({ x: a.x + i * 4, y, px: a.x + i * 4, py: y }); }
  ang = 0.25; av = 0; yv = 20; accT = 0;
}
function toWorld(e) { const r = stage.getBoundingClientRect(), cx = (SW - chatSpace()) / 2; return { x: (e.clientX - r.left - cx) / zoom + cx, y: (e.clientY - r.top) / zoom }; }
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  const p = toWorld(e), end = pts[N];
  const rotate = e.button === 2 || e.shiftKey || e.target.closest('.hint') ? true : false;
  if (e.target.closest('.hint')) return;
  stage.setPointerCapture(e.pointerId); stage.classList.add('grabbing');
  drag = { id: e.pointerId, rotate, ox: p.x - end.x, oy: p.y - end.y, lx: e.clientX, ly: e.clientY, t: performance.now() };
});
stage.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY;
  if (drag.rotate) { yaw += dx * 0.6; yv = dx * 30; tilt = Math.max(-35, Math.min(35, tilt - dy * 0.3)); pendingFlip = false; }
  else { const p = toWorld(e); drag.tx = p.x - drag.ox; drag.ty = p.y - drag.oy; yv += dx * 1.2; }
});
const endDrag = e => { if (drag && drag.id === e.pointerId) { drag = null; stage.classList.remove('grabbing'); } };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', e => { if (!e.target.closest('.hint')) doFlip(); });

  const prompt = `你是工牌设计助手。下面是我的工牌配置 brand.json（Lanyard Badge Studio 格式）。请按我的需求修改，只返回修改后的完整 JSON，不要解释。\n需求：${req || '（在这里写你的需求，例如：换成适合咖啡品牌的文案和配色）'}\n\n${JSON.stringify(slim, null, 2)}`;
  (navigator.clipboard ? navigator.clipboard.writeText(prompt) : Promise.reject()).then(
    () => say('已复制提示词 📋 粘贴给 Claude / ChatGPT / 豆包，把它返回的 JSON 整段粘贴回这里，我就会套用。'),
    () => say('浏览器不允许自动复制，请手动复制下面这段：\n\n' + prompt));
}
// dominant brand colour from an image (ignores near-white / near-black / grey pixels)
function brandColor(img) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 64, 64);
  const d = x.getImageData(0, 0, 64, 64).data, bins = {};
  for (let i = 0; i < d.length; i += 4) {
    const [r, g, b, a] = [d[i], d[i + 1], d[i + 2], d[i + 3]]; if (a < 200) continue;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx ? (mx - mn) / mx : 0;
    if (sat < 0.35 || mx < 60) continue;
    const key = [r >> 4, g >> 4, b >> 4].join(','); (bins[key] = bins[key] || { n: 0, r: 0, g: 0, b: 0 }); const o = bins[key]; o.n++; o.r += r; o.g += g; o.b += b;
  }
  const best = Object.values(bins).sort((a, b) => b.n - a.n)[0]; if (!best) return null;
  const hex = v => Math.round(v).toString(16).padStart(2, '0');
  const rr_ = best.r / best.n, gg = best.g / best.n, bb = best.b / best.n;
  return { main: '#' + hex(rr_) + hex(gg) + hex(bb), second: '#' + hex(rr_ * .82) + hex(gg * .82) + hex(bb * .82) };
}
$('chatFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (f.name.endsWith('.json')) { try { deepMerge(cfg, JSON.parse(await f.text())); fillForm(); await apply(); say('已套用 ' + f.name + ' ✅'); } catch (er) { say('JSON 读取失败：' + er.message); } return; }
  const url = await fileToURL(f); say('', 'me', `上传了 ${f.name}<img src="${url}">`);
  const im = new Image(); im.onload = async () => {
    const col = brandColor(im); cfg.logo = url;
    if (col) { cfg.theme.accent = col.main; cfg.theme.accent2 = col.second; }
    fillForm(); await apply();
    say('', 'bot', `已把它放到卡片左上角当 Logo${col ? `，并提取出品牌色：主色 ${sw(col.main)}，辅助色 ${sw(col.second)}` : '（没找到明显的彩色，品牌色保持不变）'}。<br>不满意可以说「主色 #xxxxxx」直接改；如果这张不是 Logo，说「去掉 Logo」。`);
  }; im.src = url;
};
$('chatForm').onsubmit = e => { e.preventDefault(); const v = $('chatInput').value; $('chatInput').value = '';
