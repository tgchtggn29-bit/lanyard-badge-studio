<meta property="og:title" content="Lanyard Badge Studio · 工牌工作室">

<meta http-equiv="refresh" content="0; url=studio/">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0A0A0A; color: #F5F5F5;
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    text-align: center; padding: 24px;
  }
  .wrap { max-width: 460px; }
  .badge {
    width: 96px; height: 124px; margin: 0 auto 26px;
    border-radius: 10px; background: #D8FF3E;
    display: flex; align-items: center; justify-content: center;
    color: #0A0A0A; font-weight: 900; letter-spacing: .5px;
    box-shadow: 0 18px 40px -12px rgba(216,255,62,.45);
    animation: drop 1.1s cubic-bezier(.16,.84,.36,1) both, sway 3.6s 1.1s ease-in-out infinite;
  }
  .badge span { font-size: 13px; line-height: 1.3; }
  @keyframes drop {
    0% { transform: translateY(-160px) rotate(-14deg); opacity: 0; }
    60% { transform: translateY(8px) rotate(3deg); opacity: 1; }
    78% { transform: translateY(-4px) rotate(-2deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: .2px; }
  p { margin: 0 0 22px; color: #A3A3A3; font-size: 14px; }
  a.go {
    display: inline-block; padding: 13px 30px; border-radius: 999px;
    background: #D8FF3E; color: #0A0A0A; font-weight: 800;
    text-decoration: none; letter-spacing: .3px;
  }
  a.go:hover { background: #E6FF6B; }
  .foot { margin-top: 26px; font-size: 12.5px; color: #6B6B6B; }
  .foot a { color: #8A8A8A; text-decoration: none; border-bottom: 1px solid #333; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><span>LANYARD<br>BADGE</span></div>
    <h1>Lanyard Badge Studio · 工牌工作室</h1>

    <a class="go" href="studio/">立即打开工作台 →</a>
    <p class="foot">
      <a href="https://github.com/tgchtggn29-bit/lanyard-badge-studio">GitHub 仓库</a>
      &nbsp;·&nbsp; MIT &nbsp;·&nbsp; 湾区AI日历 出品
    </p>
  </div>
